[package]
name = "nemesis_runner"
version = "0.1.0"
edition = "2021"
description = "Nemesis Studio - High-Performance Native PC Bevy Runner"
authors = ["Nemesis Studio Authors"]

[dependencies]
bevy = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
